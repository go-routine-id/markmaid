[package]
name = "markmaid"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
description = "Framework-agnostic Markdown rendering engine in pure Rust: hand-written GFM-subset parser, document layout to plain positioned geometry (DocScene) any GUI toolkit can paint, SVG/HTML writers, first-class inline mermaid diagrams via flowmaid, and optional tree-sitter syntax highlighting (Rust grammar today)."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["markdown", "gfm", "layout", "renderer", "svg"]
categories = ["text-processing", "visualization"]
repository = "https://github.com/go-routine-id/markmaid"

[features]
default = []
# Enable tree-sitter based syntax highlighting for fenced code blocks.
# Rust is the only grammar compiled in; every other info string renders
# as plain code. See `src/highlight.rs::grammars` to add one.
syntax-tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-rust"]

[dependencies]
# Satu-satunya dependency adalah keluarga sendiri: engine diagram
# flowmaid (zero-dep) — blok ```mermaid menjadi geometri inline.
flowmaid = "0.24"

# Optional tree-sitter based syntax highlighting. Kept behind a feature so
# consumers that only need plain text (SVG/HTML writers, etc.) stay light.
tree-sitter = { version = "0.26.12", optional = true }
tree-sitter-highlight = { version = "0.26.12", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
